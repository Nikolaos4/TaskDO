version: '3.8'

services:
  app: 
    build: .
    ports: 
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_URL=host=db user=postgres password=${POSTGRES_PASSWORD} dbname=taskdo port=5432 sslmode=disable

  db: 
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taskdo
    ports: 
      - "5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:  

